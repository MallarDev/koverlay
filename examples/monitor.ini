[overlay]
mode=monitor
position=top-right
marginTop=24
marginRight=24
panelOpacity=0.65
textColor=#eff0f1

[monitor]
columns=2
chartWidth=260
chartHeight=130
fontSize=12
historySeconds=60
updateInterval=1000

cpuEnabled=true
cpuSensor=cpu/all/usage
cpuColor=#3daee9
gpuEnabled=true
gpuSensor=gpu/all/usage
gpuColor=#a78bfa
ramEnabled=true
ramSensor=memory/physical/used
ramColor=#1cdc9a
vramEnabled=true
vramSensor=gpu/all/usedVram
vramColor=#f6b44b
swapEnabled=true
swapSensor=memory/swap/used
swapColor=#e879b9
diskEnabled=true
diskSensor=disk/all/used
diskColor=#f6746b
diskLabel=Disco
